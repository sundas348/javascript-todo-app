<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="TaskFlow — Premium To-Do List App by Sundas Bibi">
<title>TaskFlow — Smart To-Do App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">✔</div>
      <div class="logo-text">Task<span>Flow</span></div>
    </div>
    <div class="header-right">
      <div class="date-chip" id="dateChip">—</div>
      <button class="theme-btn" id="themeBtn" title="Toggle dark mode">🌙</button>
    </div>
  </div>
</header>

<main class="main">

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Total Tasks</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏳</div>
      <div class="stat-num" id="statPending">0</div>
      <div class="stat-label">Pending</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-num" id="statDone">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🔥</div>
      <div class="stat-num" id="statHigh">0</div>
      <div class="stat-label">High Priority</div>
    </div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-label">📊 Today's Progress</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- ADD TASK -->
  <div class="add-card">
    <div class="add-card-title">➕ Add New Task</div>
    <div class="add-row">
      <input type="text" class="task-input" id="taskInput" placeholder="What needs to be done?" maxlength="120">
      <button class="btn-add" id="addBtn">
        <span>+</span> Add Task
      </button>
    </div>
    <div class="add-meta">
      <select class="meta-select" id="catSelect">
        <option value="General">📌 General</option>
        <option value="Work">💼 Work</option>
        <option value="Study">📚 Study</option>
        <option value="Personal">👤 Personal</option>
        <option value="Health">💪 Health</option>
        <option value="Shopping">🛒 Shopping</option>
      </select>
      <select class="meta-select" id="prioritySelect">
        <option value="medium">🟡 Medium Priority</option>
        <option value="high">🔴 High Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
      <input type="date" class="date-input" id="dueDate">
    </div>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="filter-row">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="pending">Pending</button>
      <button class="filter-btn" data-filter="done">Completed</button>
      <button class="filter-btn" data-filter="high">🔴 High</button>
      <button class="filter-btn" data-filter="today">📅 Today</button>
    </div>
    <div class="toolbar-right">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search tasks...">
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
        <option value="priority">By Priority</option>
        <option value="due">By Due Date</option>
        <option value="alpha">A–Z</option>
      </select>
      <button class="btn-clear-done" id="clearDoneBtn">🗑 Clear Done</button>
    </div>
  </div>

  <!-- TASK LIST -->
  <div id="taskListWrap"></div>

</main>

<div class="footer">
  Built by <strong>Sundas Bibi</strong>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal-card">
    <div class="modal-title">
      ✏️ Edit Task
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-field">
      <label>Task Description</label>
      <input type="text" id="editInput" maxlength="120">
    </div>
    <div class="modal-field">
      <label>Category</label>
      <select id="editCat">
        <option value="General">📌 General</option>
        <option value="Work">💼 Work</option>
        <option value="Study">📚 Study</option>
        <option value="Personal">👤 Personal</option>
        <option value="Health">💪 Health</option>
        <option value="Shopping">🛒 Shopping</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Priority</label>
      <select id="editPriority">
        <option value="high">🔴 High Priority</option>
        <option value="medium">🟡 Medium Priority</option>
        <option value="low">🟢 Low Priority</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Due Date</label>
      <input type="date" id="editDue">
    </div>
    <div class="modal-btns">
      <button class="btn-save" id="saveEdit">💾 Save Changes</button>
      <button class="btn-cancel" id="cancelEdit">Cancel</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
</body>
</html>
